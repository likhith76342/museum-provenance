services:
  db:
    image: pgvector/pgvector:pg17
    container_name: museum_db
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - museum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  museum_pgdata:
